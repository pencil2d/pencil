name: Build & Tests
permissions:
  contents: read
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.ps1'
  pull_request:
    # Need to repeat these paths - YAML anchors aren’t supported on GHA atm
    # (or any other CI service that I know of, for that matter)
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.ps1'
  workflow_dispatch:
jobs:
  verification-tests:
    name: Download verification / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s util/tests -v

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Qt 5 / Linux x86_64
            os: ubuntu-latest
            container: "rockylinux/rockylinux:8"
            qt: 5
            bundler: linuxdeployqt
          - name: Qt 5 / macOS x86_64
            os: macos-15-intel
            arch: x86_64
            container:
            qt: 5
          - name: Qt 5 / Windows x86
            os: windows-2022
            arch: win32_msvc2019
            vcvars: x86
            container:
            qt: 5
          - name: Qt 5 / Windows x86_64
            os: windows-2022
            arch: win64_msvc2019_64
            vcvars: x64
            container:
            qt: 5
          - name: Qt 6 / Linux x86_64
            os: ubuntu-latest
            container: "rockylinux/rockylinux:9"
            qt: 6
            bundler: linuxdeploy
          - name: Qt 6 / macOS Universal
            os: macos-14
            arch: universal
            container:
            qt: 6
          - name: Qt 6 / Windows x86_64
            os: windows-2022
            arch: win64_msvc2019_64
            vcvars: x64
            container:
            qt: 6

    name: ${{matrix.name}}
    runs-on: ${{matrix.os}}
    timeout-minutes: 20
    env: { CONTAINER: "${{matrix.container}}", BUILD_CMD: "" }
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up container (Linux)
        if: runner.os == 'Linux'
        # XXX: --privileged is sort of a brute-force solution to get FUSE
        #      working inside Docker, however so far I haven’t been able to
        #      figure out precisely *which* privileges are needed.
        run: |
          touch "${{github.workspace}}/env"
          docker run --detach --privileged --workdir /workspace --volume "${{github.workspace}}:/workspace" --name "ci_${{github.sha}}" --entrypoint "tail" "${{matrix.container}}" -f /dev/null
          echo '#!/usr/bin/env bash' > "${{github.workspace}}/build-cmd"
          echo 'exec docker exec --env-file <(cat "${{github.workspace}}/env") "ci_${{github.sha}}" "$@"' >> "${{github.workspace}}/build-cmd"
          chmod +x "${{github.workspace}}/build-cmd"
          echo 'BUILD_CMD=${{github.workspace}}/build-cmd' >> "${GITHUB_ENV}"
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          arch: ${{matrix.arch}}
          qt: ${{matrix.qt}}
      - name: Set up environment
        uses: ./.github/actions/setup-environment
        with:
          arch: ${{matrix.arch}}
          vcvars: ${{matrix.vcvars}}
      - name: Configure build
        run: >
          mkdir build; ${{runner.os == 'Linux' && '${BUILD_CMD}' || ''}}
          ${{runner.os == 'Linux' && matrix.qt == 5 && 'qmake-qt5' || 'qmake'}}
          -o build PREFIX=/usr CONFIG-=debug_and_release CONFIG+=GIT
          VERSION=${{ env.VERSION_NUMBER }}
          ${{runner.os == 'macOS' && matrix.qt == 6 && 'QMAKE_APPLE_DEVICE_ARCHS="x86_64 arm64"' || ''}}

      - name: Build Pencil2D
        run: ${{runner.os != 'Windows' && '${BUILD_CMD} make -C build' || 'cd build; nmake'}}

      - name: Run tests
        run: ${{runner.os == 'Linux' && '${BUILD_CMD}' || ''}} env QT_QPA_PLATFORM=minimal build/tests/tests

      - name: Create package
        id: package
        uses: ./.github/actions/create-package
        with:
          arch: ${{matrix.arch}}
          qt: ${{matrix.qt}}
          bundler: ${{matrix.bundler}}

      - name: Code Sign and Notarize App
        if: runner.os == 'macOS'
        uses: ./.github/actions/notarize-macos-app
        with:
          app_path: "build/${{steps.package.outputs.output-basename}}.zip"
          p12_base64: ${{ secrets.P12_BASE64 }}
          p12_password: ${{ secrets.P12_PASSWORD }}
          apple_id: ${{ secrets.APPLE_ID }}
          apple_id_password: ${{ secrets.APPLE_ID_PASSWORD }}
          team_id: ${{ secrets.APPLE_TEAM_ID }}
          certificate_identity: ${{ secrets.CODESIGN_CERT_IDENTITY }}

      - name: Resolve path
        id: resolve
        shell: bash
        env:
          BASENAME: ${{ steps.package.outputs.output-basename }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            for ext in dmg zip; do
              if [ -f "build/${BASENAME}.${ext}" ]; then
                echo "package1=build/${BASENAME}.${ext}" >> $GITHUB_OUTPUT
                exit 0
              fi
            done

            echo "ERROR: No macOS package found"
            exit 1
          else
            files=(build/${BASENAME}*)
            if [ ! -e "${files[0]}" ]; then
              echo "ERROR: No package found"
              exit 1
            fi
            if [ "${#files[@]}" -gt 3 ]; then
              echo "ERROR: More than three packages found"
              exit 1
            fi
            echo "package1=${files[0]}" >> $GITHUB_OUTPUT
            echo "package2=${files[1]}" >> $GITHUB_OUTPUT
            echo "package3=${files[2]}" >> $GITHUB_OUTPUT
          fi

      # Hash the final bytes, including any signing/notarization above.
      - name: Set up Python for download verification
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Create package checksums
        shell: bash
        env:
          PACKAGE1: ${{ steps.resolve.outputs.package1 }}
          PACKAGE2: ${{ steps.resolve.outputs.package2 }}
          PACKAGE3: ${{ steps.resolve.outputs.package3 }}
        run: |
          packages=("$PACKAGE1")
          if [ -n "$PACKAGE2" ]; then packages+=("$PACKAGE2"); fi
          if [ -n "$PACKAGE3" ]; then packages+=("$PACKAGE3"); fi
          python util/download_verification.py create "${packages[@]}"

      - name: Upload package one
        uses: actions/upload-artifact@v7
        with:
          path: ${{steps.resolve.outputs.package1}}
          archive: false
      - name: Upload package two
        if: steps.resolve.outputs.package2
        uses: actions/upload-artifact@v7
        with:
          path: ${{steps.resolve.outputs.package2}}
          archive: false
      - name: Upload package three
        if: steps.resolve.outputs.package3
        uses: actions/upload-artifact@v7
        with:
          path: ${{steps.resolve.outputs.package3}}
          archive: false
      - name: Upload checksum one
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.resolve.outputs.package1 }}.sha256
          archive: false
          if-no-files-found: error
      - name: Upload checksum two
        if: steps.resolve.outputs.package2
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.resolve.outputs.package2 }}.sha256
          archive: false
          if-no-files-found: error
      - name: Upload checksum three
        if: steps.resolve.outputs.package3
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.resolve.outputs.package3 }}.sha256
          archive: false
          if-no-files-found: error
      - name: Generate summary
        shell: bash
        run: >
          echo "Build will be available for download
          [here](https://get.pencil2d.org/@${{github.repository_owner}}/${{github.run_id}}/${{steps.package.outputs.output-basename}})
          once the run is finished." > "${GITHUB_STEP_SUMMARY}"

      - name: Stop container (Linux)
        if: runner.os == 'Linux'
        run: docker stop "ci_${{github.sha}}"

  provenance:
    name: Authenticate final downloads
    needs: [build, verification-tests]
    # Never grant OIDC credentials to pull-request builds. The build jobs above
    # stay read-only; this job only downloads and attests completed artifacts.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' ||
       startsWith(github.ref, 'refs/heads/release/') ||
       startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Download final packages and checksum sidecars
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: verification
          merge-multiple: true
      - name: Check downloaded package integrity
        run: python util/download_verification.py verify verification/*.sha256
      - name: Attest final packages and checksum sidecars
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: verification/*
      - name: Name the portable attestation bundle
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" pencil2d-provenance.sigstore.json
      - name: Upload portable attestation bundle
        uses: actions/upload-artifact@v7
        with:
          path: pencil2d-provenance.sigstore.json
          archive: false
          if-no-files-found: error
